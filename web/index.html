<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>contextengine tester</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>contextengine tester</h1>
    <span id="ws-status" class="status status-connecting">connecting…</span>
  </header>

  <main>
    <section class="panel">
      <h2>데이터 주입</h2>
      <form id="inject-form">
        <input type="text" name="category" placeholder="category (예: Setting)" required />
        <input type="text" name="key" placeholder="key (예: language)" required />
        <input type="text" name="value" placeholder='value (JSON, 예: "ko_KR" 또는 {"a":1})' required />
        <button type="submit">주입</button>
      </form>
      <button id="clear-test-btn" class="secondary">test-injected 데이터 일괄 삭제</button>
    </section>

    <section class="panel">
      <h2>실시간 context</h2>
      <table id="context-table">
        <thead>
          <tr>
            <th>category</th>
            <th>key</th>
            <th>value</th>
            <th>source</th>
            <th>updated</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="context-tbody"></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>
        카탈로그 로드 상태
        <button id="catalog-refresh-btn" class="secondary small">새로고침</button>
      </h2>
      <p class="hint">plugin이 제공하기로 선언한 데이터(카탈로그)와 실제 수신 여부를 대조합니다.</p>
      <table id="catalog-table">
        <thead>
          <tr>
            <th>plugin</th>
            <th>category</th>
            <th>key</th>
            <th>type</th>
            <th>description</th>
            <th>status</th>
            <th>last reported</th>
            <th>last value</th>
          </tr>
        </thead>
        <tbody id="catalog-tbody"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
